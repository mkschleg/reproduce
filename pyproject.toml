[project]
name = "reproduce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cloudpickle>=3.1.2",
    "pyyaml>=6.0.3",
    "tol-colors>=2.2.0",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
analysis = [
    "altair>=6.0.0",
    "marimo>=0.18.4",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "plotly>=6.5.1",
]
dev = [
    "ipython>=8.38.0",
]
test = [
    "pytest>=9.0.2",
]


[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

